name: Build and deploy

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

env:
  DOCKER_IMAGE: ghcr.io/devopsmindset/velero-ui-evo
  NX_BASE: main

jobs:
  main:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx run-many -t build --prod

      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker Image
        env:
          DOCKER_TAG: ${{ steps.package-version.outputs.current-version }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 . -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest --push

